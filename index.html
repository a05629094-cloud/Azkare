<!DOCTYPE html>
<html>
<head>
    <link rel="manifest" href="./manifest.json">

<meta name="theme-color" content="#064635">

<link rel="icon" type="image/png" href="./icon-192.png">

<link rel="apple-touch-icon" href="./icon-192.png">
    <title>لعبة النقاط</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightblue;
        }

        button {
            background-color: green;
            color: white;
            padding: 15px 30px;
            font-size: 20px;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <h1>مسبحة 📿</h1>

    <h2>تسبيحك: <span id="score">0</span></h2>

    <button onclick="addPoint()">سبح📿</button>

    <script>
        let points = 0;

        function addPoint() {
            points++;
            document.getElementById("score").innerHTML = points;
        }
    </script>

   <div id="welcome-screen" style="
min-height:100vh;
width:100%;
background-image:url('./welcome.jpg');
background-size:cover;
background-position:center;
background-repeat:no-repeat;
position:relative;
display:flex;
justify-content:center;
align-items:flex-end;
box-sizing:border-box;
padding-bottom:60px;
">
  <button onclick="
    document.getElementById('welcome-screen').style.display='none';
    document.getElementById('home').style.display='block';
    document.getElementById('site-footer').style.display='block';
  " style="
    background:#D4AF37;
    color:#064635;
    border:2px solid #B8860B;
    border-radius:30px;
    padding:15px 45px;
    font-size:20px;
    font-weight:bold;
    cursor:pointer;
  ">
    ابدأ الآن
  </button>
</div> 
<main id="home" style="display:none;">
    سبحان الله <br>
    الحمد لله <br>
    لا إله إلا الله
</main>

<footer id="site-footer" style="display:none;">
    <a href="index.html">
        <button>السبحة</button>
    </a>

    <a href="page2.html">
        <button>الأدعية</button>
    </a>
</footer>

</body>
</html>
