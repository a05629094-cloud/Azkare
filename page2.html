<!DOCTYPE html>
<html>
<head>
    <title>الأدعية</title>

    <style>
        body {
            text-align: right;
            background-color: white;
            font-family: Arial;
            padding: 15px;
        }

        h1 {
            color: green;
            text-align: center;
        }

        button {
            background-color: green;
            color: white;
            padding: 8px 12px;
            font-size: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #card {
            background-color: lightgreen;
            padding: 15px;
            margin-top: 15px;
            border-radius: 12px;
            display: none;
            text-align: center;
        }

        footer {
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>

<body>

    <h1>الأدعية 🤲</h1>

    <button onclick="showDua()">دعاء بعد الأذان</button>

    <div id="card">
        <h2>دعاء بعد الأذان</h2>

        <p>
       اللهم رب هذه الدعوة التامة والصلاه القائمة اتي سيدنا محمد الوسيلة والفضيلة والدرجة العلية الرفيعة وابعثه الله المقام المحمود الذي وعدته وصلى الله وسلم على محمد على اهله وصحبه اجمعين
        </p>
    </div>

    <footer>
        <a href="index.html">
            <button>السبحة</button>
        </a>

        <a href="page2.html">
            <button>الأدعية</button>
        </a>
    </footer>

    <script>
        function showDua() {
            document.getElementById("card").style.display = "block";
        }
    </script>

</body>
</html>
